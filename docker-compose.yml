# Development: `docker compose up -d` starts only the database (host port 54329).
# Everything: `docker compose --profile app up -d --build` runs db, app (migrates on
# start), scheduler (purge, classifier update, daily reminders) and nightly backup.
# Add `--profile bot` for the Telegram long-polling bot. DEPLOY.md has the details.
# Inlined into the browser bundle at build time; rebuild after changing.
x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_DEMO_URL: ${NEXT_PUBLIC_DEMO_URL:-/demo}
    NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    NEXT_PUBLIC_SHOW_LEGAL_223: ${NEXT_PUBLIC_SHOW_LEGAL_223:-false}
    NEXT_PUBLIC_FEATURE_MULTI_CLIENT: ${NEXT_PUBLIC_FEATURE_MULTI_CLIENT:-false}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mxik-audit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mxik
      # Set POSTGRES_PASSWORD in .env for any server; the default suits local development only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mxik}
      POSTGRES_DB: mxik
      # Uzbek/Russian text sorts under ICU; keep the collation explicit.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und"
    ports:
      # Loopback only. Docker-published ports bypass host firewalls such as ufw,
      # so binding 0.0.0.0 would expose Postgres to the internet on a VPS.
      - "127.0.0.1:54329:5432"
    # Parallel index builds and parallel queries use shared memory; the 64MB
    # Docker default is far too small and fails with ENOSPC. The HNSW builds in
    # scripts/lib/hnsw.ts are serial (a 2 GB maintenance_work_mem segment did
    # not fit in 2gb, DEPLOY.md section 4); keep maintenance_work_mem well below this.
    shm_size: "2gb"
    volumes:
      - mxik-pgdata:/var/lib/postgresql/data
    command:
      - postgres
      # 443k rows plus two vector indexes; the defaults are too small to build them.
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxik -d mxik"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: *app-build
    image: mxik-audit-app
    container_name: mxik-audit-app
    # Applies pending migrations, then serves.
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is "db" on 5432, whatever .env says.
      DATABASE_URL: postgresql://mxik:${POSTGRES_PASSWORD:-mxik}@db:5432/mxik?schema=public
      NODE_ENV: production
    ports:
      # nginx on the host terminates HTTPS and proxies here.
      - "127.0.0.1:3000:3000"
    volumes:
      # Classifier downloads and the ingest output live on the host.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy


  # Scheduled jobs (purge, daily classifier update, daily reminders); replaces the host crontab.
  scheduler:
    profiles: ["app"]
    image: mxik-audit-app
    container_name: mxik-audit-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mxik:${POSTGRES_PASSWORD:-mxik}@db:5432/mxik?schema=public
      NODE_ENV: production
    command: ["node", "scripts/scheduler.mjs"]
    volumes:
      - ./data:/app/data
    depends_on:
      app:
        condition: service_healthy

  # Telegram long-polling bot, for setups without a public HTTPS webhook (profile "bot").
  telegram-bot:
    profiles: ["bot"]
    build: *app-build
    image: mxik-audit-app
    container_name: mxik-audit-telegram-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mxik:${POSTGRES_PASSWORD:-mxik}@db:5432/mxik?schema=public
      NODE_ENV: production
    command: ["npm", "run", "telegram:bot"]
    depends_on:
      db:
        condition: service_healthy

  # Nightly pg_dump at 03:45 UTC+5, 14 dumps kept in ./backups.
  backup:
    profiles: ["app"]
    image: pgvector/pgvector:pg16
    container_name: mxik-audit-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mxik}
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); next=$$(date -d "03:45" +%s)
          [ $$next -le $$now ] && next=$$((next + 86400))
          sleep $$((next - now))
          pg_dump -h db -U mxik -Fc mxik > /backups/mxik-$$(date +%F).dump
          find /backups -name '*.dump' -mtime +14 -delete
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  mxik-pgdata:
